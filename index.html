<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="tc" content="#0f0d1c">
<title>Tela touch</title>
<style>
:root{--bg:#0f0d1c;--card:#1a1733;--line:#2e2a5a;--txt:#ece9ff;--mut:#9a96c4;--acc:#6e46c8;--h:64px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px}
body{min-height:100vh;user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow-x:hidden}
body.local{--acc:#d98a1a;--bg:#1a1206}
body.remoto{--acc:#1a9ad9;--bg:#06141f}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
#faixa{padding:10px 16px;font-weight:800;font-size:15px;letter-spacing:.4px;color:#fff;background:var(--acc);text-align:center}
#top{display:flex;align-items:center;gap:12px;padding:12px 16px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
#back{min-width:var(--h);height:var(--h);border-radius:16px;background:var(--acc);color:#fff;font-size:34px;font-weight:800;line-height:1}
#crumb{flex:1;font-size:15px;color:var(--mut);line-height:1.25}
#crumb b{display:block;color:var(--txt);font-size:22px}
.dot{width:16px;height:16px;border-radius:50%;background:#666;flex:none}
.dot.on{background:#3ddc97;box-shadow:0 0 10px #3ddc97}.dot.off{background:#ff5a6a}
#view{padding:16px;max-width:1100px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.grid.home{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.tile{display:flex;align-items:center;gap:14px;text-align:left;width:100%;min-height:96px;padding:16px 18px;border-radius:20px;color:#fff;box-shadow:0 6px 18px #0006;transition:transform .1s,filter .1s;position:relative}
.home .tile{min-height:150px;padding:20px}
.tile:active{transform:scale(.96);filter:brightness(1.2)}
.tile.busy{opacity:.6}
.tile .ic{font-size:44px;line-height:1;flex:none}
.home .tile .ic{font-size:56px}
.tile .tx{flex:1;min-width:0}
.tile b{display:block;font-size:21px}
.tile small{display:block;font-size:14px;opacity:.88;margin-top:3px}
.tile .ar{font-size:38px;font-weight:800;opacity:.9;flex:none}
.ok{background:linear-gradient(135deg,#1e8c5a,#2bc07a)}.bad{background:linear-gradient(135deg,#aa3246,#e8506a)}
.neutral{background:linear-gradient(135deg,#3c376e,#5f57b3)}.acc{background:linear-gradient(135deg,var(--acc),#fff3)}
.tile.sel{outline:4px solid #fff}
.tile.mini{min-height:64px;padding:10px 16px;justify-content:center;text-align:center;border-radius:16px}
.tile.mini b{font-size:20px}
h2{font-size:19px;margin:24px 0 12px;display:flex;gap:8px;align-items:center}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 6px 18px #0004}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.mt b{display:block;font-size:13px;color:var(--mut);letter-spacing:.4px}
.mt .v{font-size:28px;font-weight:800;margin-top:2px}
.mt .tr{height:12px;border-radius:8px;background:#0a0818;margin-top:8px;overflow:hidden}
.mt .tr i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#fff8);transition:width .6s}
.mt .ex{font-size:13px;color:var(--mut);margin-top:6px}
.row{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}
.row>*{flex:1;min-width:110px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.lin{display:flex;gap:10px;align-items:stretch;margin-bottom:12px}
.lin .tile:first-child{flex:1}.lin .tile.mini{flex:none;width:76px}
pre{background:#07060f;border:1px solid var(--line);border-radius:16px;padding:14px;white-space:pre-wrap;word-break:break-word;font:14px ui-monospace,Consolas,monospace;min-height:80px;max-height:55vh;overflow:auto;user-select:text;-webkit-user-select:text}
.vazio{color:var(--mut);padding:18px;text-align:center;border:2px dashed var(--line);border-radius:18px}
#pad{height:calc(100vh - 330px);min-height:240px;border:3px dashed var(--acc);border-radius:20px;background:#07060f;touch-action:none;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:17px;text-align:center;padding:14px}
#pad.on{background:#120f26}
#shot{width:100%;border-radius:16px;margin-top:14px;border:1px solid var(--line);display:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#3ddc97;color:#04130c;padding:14px 22px;border-radius:99px;font-weight:800;font-size:18px;opacity:0;transition:.25s;pointer-events:none;max-width:92%;z-index:99;text-align:center}
#toast.show{opacity:1}#toast.err{background:#ff5a6a;color:#fff}
.ov{position:fixed;inset:0;background:#000b;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.ov.mid{align-items:center;padding:16px}
.sh{background:var(--card);border-top:3px solid var(--acc);border-radius:24px 24px 0 0;width:100%;max-width:1000px;padding:14px;max-height:100vh;overflow:auto}
.ov.mid .sh{border:3px solid var(--acc);border-radius:24px;max-width:560px}
.sh .mq{font-size:22px;font-weight:700;padding:10px 6px 6px;white-space:pre-wrap;word-break:break-word}
.kb .top{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.kb .top .tl{flex:1;text-align:center;font-weight:800;font-size:18px;color:var(--mut)}
.kb .top button{height:56px;min-width:110px;border-radius:14px;font-weight:800;font-size:19px;color:#fff}
.vis{min-height:64px;max-height:22vh;overflow:auto;background:#07060f;border:2px solid var(--acc);border-radius:14px;padding:12px 14px;font-size:22px;white-space:pre-wrap;word-break:break-all;margin-bottom:10px;user-select:text}
.vis .cr{display:inline-block;width:2px;height:1.1em;background:var(--acc);vertical-align:text-bottom;margin:0 1px;animation:pisca 1s steps(1) infinite}
@keyframes pisca{50%{opacity:0}}
.kr{display:flex;gap:6px;margin-bottom:6px}
.kr button{flex:1;height:clamp(52px,8.4vh,68px);border-radius:12px;background:#3c376e;font-size:24px;font-weight:700;color:#fff;min-width:0}
.kr button:active{background:var(--acc)}
.kr button.w{flex:1.6}.kr button.ww{flex:4}.kr button.f{background:#2a2552;font-size:19px}.kr button.on{background:var(--acc)}
.kr button.go{background:linear-gradient(135deg,#1e8c5a,#2bc07a)}
.kr.q button{height:52px;font-size:18px;background:#2a2552}
.np{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.np button{height:clamp(58px,10vh,76px);border-radius:14px;background:#3c376e;font-size:30px;font-weight:800;color:#fff}
.np button:active{background:var(--acc)}
@media (max-width:520px){html,body{font-size:16px}.grid,.grid.home{grid-template-columns:1fr}.tile .ic{font-size:38px}.home .tile{min-height:120px}}
</style>
</head>
<body>
<div id="faixa"></div>
<div id="top"><button id="back" aria-label="voltar">&#8592;</button><div id="crumb"></div><span class="dot" id="conn"></span></div>
<div id="view"></div>
<div id="toast"></div>
<input type="file" id="arq" style="display:none">
<script>
const $ = s => document.querySelector(s);
const E = c => String.fromCodePoint.apply(null, c);
const LOCAL = ['127.0.0.1', 'localhost'].indexOf(location.hostname) >= 0;
document.body.className = LOCAL ? 'local' : 'remoto';
$('#faixa').textContent = LOCAL ? E([0x1F5A5, 0xFE0F]) + ' VOCE ESTA NA TELA TOUCH (painel local)' : E([0x1F517]) + ' REMOTO: controlando a tela touch de outro computador';
document.title = LOCAL ? 'AQUI - Tela touch' : 'REMOTO - Tela touch';
$('#tc').content = LOCAL ? '#d98a1a' : '#1a9ad9';

let TOKEN = '';
try { TOKEN = localStorage.getItem('tk') || ''; } catch (e) {}
if (location.hash.length > 1 && location.hash.indexOf('#/') !== 0) {
  TOKEN = decodeURIComponent(location.hash.slice(1));
  try { localStorage.setItem('tk', TOKEN); } catch (e) {}
  history.replaceState(null, '', location.pathname);
}

function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function vib() { try { navigator.vibrate && navigator.vibrate(12); } catch (e) {} }
let toastT = null;
function toast(t, ruim) { const x = $('#toast'); x.textContent = t; x.className = 'show' + (ruim ? ' err' : ''); clearTimeout(toastT); toastT = setTimeout(() => { x.className = ''; }, 3200); }
const sleep = ms => new Promise(r => setTimeout(r, ms));

let pedindo = false;
async function api(rota, corpo) {
  const r = await fetch('/api/' + rota, { method: corpo ? 'POST' : 'GET', headers: { 'X-Token': TOKEN, 'Content-Type': 'application/json' }, body: corpo ? JSON.stringify(corpo) : undefined });
  if (r.status === 401) { pedirToken(); throw new Error('token errado'); }
  return r.json();
}
async function pedirToken() {
  if (pedindo) return; pedindo = true;
  const v = await Teclado.abrir({ titulo: 'Token do painel (toca nos numeros)', somenteNum: true });
  pedindo = false;
  if (v) { TOKEN = v.trim(); try { localStorage.setItem('tk', TOKEN); } catch (e) {} refresh(); }
}

/* ---------- folhas: confirmar, resultado, teclado ---------- */
function folha(cls, build) { const o = el('div', 'ov ' + (cls || '')); const b = el('div', 'sh'); o.appendChild(b); document.body.appendChild(o); const close = () => o.remove(); build(b, close); return close; }
function confirmar(msg, sim, cls) {
  return new Promise(res => folha('mid', (b, close) => {
    b.appendChild(el('div', 'mq')).textContent = msg;
    const d = el('div', 'two');
    const n = el('button', 'tile neutral mini', '<b>Nao</b>'), s = el('button', 'tile ' + (cls || 'bad') + ' mini', '<b></b>');
    s.querySelector('b').textContent = sim || 'Sim';
    n.onclick = () => { close(); res(false); }; s.onclick = () => { close(); res(true); };
    d.appendChild(n); d.appendChild(s); b.appendChild(d);
  }));
}
function resultado(titulo, texto) {
  folha('mid', (b, close) => {
    b.appendChild(el('div', 'mq')).textContent = titulo;
    const p = el('pre'); p.textContent = texto; p.style.marginTop = '8px'; b.appendChild(p);
    const d = el('div', 'two');
    const c = el('button', 'tile neutral mini', '<b>' + E([0x1F4CB]) + ' Copiar</b>'), f = el('button', 'tile acc mini', '<b>Fechar</b>');
    c.onclick = () => copiar(texto).then(() => toast('Copiado'), () => toast('Nao consegui copiar', true));
    f.onclick = close; d.appendChild(c); d.appendChild(f); b.appendChild(d);
  });
}
function copiar(t) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
  return new Promise((ok, erro) => {
    const a = document.createElement('textarea'); a.value = t; a.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(a); a.focus(); a.select();
    try { document.execCommand('copy') ? ok() : erro(new Error('negado')); } catch (e) { erro(e); }
    document.body.removeChild(a);
  });
}

const Teclado = {
  abrir(o) {
    return new Promise(res => folha('', (b, close) => {
      let txt = String(o.valor || ''), pos = txt.length, shift = false, pg = o.pagina || 'abc';
      b.classList.add('kb');
      const fim = v => { close(); res(v); };
      function ins(s) { txt = txt.slice(0, pos) + s + txt.slice(pos); pos += s.length; }
      function apaga() { if (pos > 0) { txt = txt.slice(0, pos - 1) + txt.slice(pos); pos--; } }
      const L = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
      const ACC = ['\u00e1\u00e0\u00e2\u00e3\u00e9\u00ea\u00ed', '\u00f3\u00f4\u00f5\u00fa\u00fc\u00e7']
      const NUM = ['1234567890', '-/:;()$&@"', '.,?!\''];
      const SIM = ['[]{}#%^*+=', '_\\|~<>', '.,?!\''];
      function tecla(lbl, fn, cls, rep) {
        const k = el('button', cls || ''); k.textContent = lbl;
        let t = null, i = null;
        k.addEventListener('pointerdown', e => { e.preventDefault(); vib(); fn(); draw(true); if (rep) { t = setTimeout(() => { i = setInterval(() => { fn(); draw(true); }, 70); }, 450); } });
        const para = () => { clearTimeout(t); clearInterval(i); };
        k.addEventListener('pointerup', para); k.addEventListener('pointerleave', para); k.addEventListener('pointercancel', para);
        return k;
      }
      function linha(cls) { return el('div', 'kr' + (cls ? ' ' + cls : '')); }
      let top, vis, corpo;
      function draw(soTexto) {
        const t1 = txt.slice(0, pos), t2 = txt.slice(pos);
        vis.innerHTML = ''; vis.appendChild(document.createTextNode(t1)); vis.appendChild(el('span', 'cr')); vis.appendChild(document.createTextNode(t2));
        if (soTexto === true && corpo.dataset.pg === pg + shift) return;
        corpo.dataset.pg = pg + shift; corpo.innerHTML = '';
        if (pg === 'num' && !o.multilinha && o.somenteNum) { numpad(); return; }
        if (o.rapidas !== false && !o.somenteNum) {
          const q = linha('q');
          (o.rapidas || ['https://', '.com', '.com.br', '@', '/']).forEach(s => q.appendChild(tecla(s, () => ins(s))));
          corpo.appendChild(q);
        }
        let rows;
        if (pg === 'abc') rows = L.map(r => r.split('')); else if (pg === 'acc') rows = [ACC[0].split(''), ACC[1].split('')]; else if (pg === 'num') rows = NUM.map(r => r.split('')); else rows = SIM.map(r => r.split(''));
        rows.forEach((r, ri) => {
          const d = linha();
          if (ri === 2 && pg === 'abc') d.appendChild(tecla(shift ? '\u21E7' : '\u21E7', () => { shift = !shift; }, 'f w' + (shift ? ' on' : '')));
          r.forEach(c => { const up = (pg === 'abc' || pg === 'acc') && shift; d.appendChild(tecla(up ? c.toUpperCase() : c, () => { ins(up ? c.toUpperCase() : c); if (shift) shift = false; })); });
          if (ri === rows.length - 1) d.appendChild(tecla('\u232B', apaga, 'f w', true));
          corpo.appendChild(d);
        });
        const d = linha();
        if (pg === 'abc' || pg === 'acc') {
          d.appendChild(tecla('123', () => { pg = 'num'; }, 'f w'));
          d.appendChild(tecla(pg === 'abc' ? '\u00e1' : 'abc', () => { pg = pg === 'abc' ? 'acc' : 'abc'; }, 'f'));
        } else {
          d.appendChild(tecla('abc', () => { pg = 'abc'; }, 'f w'));
          d.appendChild(tecla(pg === 'num' ? '#+=' : '123', () => { pg = pg === 'num' ? 'sim' : 'num'; }, 'f'));
        }
        d.appendChild(tecla('\u25C0', () => { if (pos > 0) pos--; }, 'f'));
        d.appendChild(tecla('espaco', () => ins(' '), 'ww f'));
        d.appendChild(tecla('\u25B6', () => { if (pos < txt.length) pos++; }, 'f'));
        if (o.multilinha) d.appendChild(tecla('\u21B5', () => ins('\n'), 'f w'));
        corpo.appendChild(d);
      }
      function numpad() {
        const g = el('div', 'np');
        '123456789'.split('').forEach(c => g.appendChild(tecla(c, () => ins(c))));
        g.appendChild(tecla('Limpar', () => { txt = ''; pos = 0; }));
        g.appendChild(tecla('0', () => ins('0')));
        g.appendChild(tecla('\u232B', apaga, '', true));
        corpo.appendChild(g);
        const d = linha(); d.appendChild(tecla('ABC (letras)', () => { o.somenteNum = false; pg = 'abc'; }, 'f')); corpo.appendChild(d);
      }
      top = el('div', 'top');
      const c = el('button', 'tile neutral mini'); c.textContent = '\u2715 Cancelar'; c.style.cssText = 'width:auto;min-height:56px;font-size:19px;font-weight:800';
      const ok = el('button', 'tile ok mini'); ok.textContent = '\u2714 Pronto'; ok.style.cssText = 'width:auto;min-height:56px;font-size:19px;font-weight:800';
      const tl = el('div', 'tl'); tl.textContent = o.titulo || '';
      c.onclick = () => fim(null); ok.onclick = () => fim(txt);
      top.appendChild(c); top.appendChild(tl); top.appendChild(ok);
      vis = el('div', 'vis'); corpo = el('div');
      b.appendChild(top); b.appendChild(vis); b.appendChild(corpo);
      if (o.somenteNum) pg = 'num';
      draw();
    }));
  }
};

/* ---------- roteador ---------- */
const R = {}; let cur = null, ST = {}, SIS = null, MAC = [], KCFG = { cidade: '', lat: null, lon: null, projetos: [] };
const rota = () => location.hash.replace(/^#\/?/, '') || 'inicio';
const go = r => { location.hash = '#/' + r; };
function render() {
  const r = rota(); cur = R[r] || R.inicio; const v = $('#view'); v.innerHTML = '';
  const pai = cur.parent && R[cur.parent] ? R[cur.parent].t : null;
  $('#crumb').innerHTML = (pai ? pai + ' &#8250; ' : '') + '<b></b>'; $('#crumb b').textContent = E(cur.e) + ' ' + cur.t;
  $('#back').style.visibility = (R[r] && r !== 'inicio') ? 'visible' : 'hidden';
  cur.render(v); window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);
$('#back').onclick = () => { vib(); go(cur.parent || 'inicio'); };

function tile(o) {
  const b = el('button', 'tile ' + (o.cls || 'neutral'));
  b.innerHTML = '<span class="ic"></span><span class="tx"><b></b><small></small></span>' + (o.arrow ? '<span class="ar">&#8594;</span>' : '');
  b.querySelector('.ic').textContent = o.e ? E(o.e) : ''; b.querySelector('b').textContent = o.t; b.querySelector('small').textContent = o.s || '';
  if (!o.e) b.querySelector('.ic').remove(); if (!o.s) b.querySelector('small').remove();
  b.onclick = async () => {
    vib(); if (b.classList.contains('busy')) return; b.classList.add('busy');
    try { await o.go(); } catch (e) { toast(String(e.message || e), true); }
    b.classList.remove('busy');
  };
  return b;
}
function mini(t, cls, fn) { const b = el('button', 'tile mini ' + (cls || 'neutral'), '<b></b>'); b.querySelector('b').textContent = t; b.onclick = () => { vib(); fn(); }; return b; }
function grid(v, cls) { const g = el('div', 'grid ' + (cls || '')); v.appendChild(g); return g; }
const tri = v => v === 'on' ? ['ok', 'LIGADO (toca pra desligar)'] : v === 'off' ? ['bad', 'DESLIGADO (toca pra ligar)'] : ['neutral', 'nao encontrado'];
const post = async (rota, corpo, ok) => { const r = await api(rota, corpo); toast(r.msg || ok || 'ok', r.ok === false); return r; };

/* ---------- INICIO ---------- */
R.inicio = { t: 'Inicio', e: [0x1F3E0], render(v) {
  const g = grid(v, 'home'); this.g = g; this.upd();
}, upd() {
  const g = this.g; if (!g || !g.isConnected) return; g.innerHTML = '';
  const sis = SIS ? 'CPU ' + (SIS.cpu == null ? '...' : SIS.cpu + '%') + '  RAM ' + SIS.ram_pct + '%' : 'carregando...';
  [
    ['controle', [0x1F5A5, 0xFE0F], 'Controle', (ST.teclado_bloqueado ? 'teclado BLOQUEADO' : 'teclado liberado') + ', touchpad ' + (ST.touchpad === 'on' ? 'ligado' : ST.touchpad === 'off' ? 'desligado' : '?')],
    ['midia', [0x1F3A7], 'Midia e tela', 'volume, brilho, foto, mouse'],
    ['enviar', [0x1F4E4], 'Enviar', 'link, arquivo, area de transferencia, texto'],
    ['status', [0x1F4CA], 'Status', sis],
    ['macros', [0x1F39B, 0xFE0F], 'Macros', MAC.length + ' botoes (webhooks)'],
    ['kiosk', [0x1F5BC, 0xFE0F], 'Kiosk', 'relogio, clima, projetos'],
    ['sistema', [0x2699, 0xFE0F], 'Sistema', 'atualizar, token, PC, PowerShell']
  ].forEach(a => g.appendChild(tile({ e: a[1], t: a[2], s: a[3], arrow: true, go: () => go(a[0]) })));
} };

/* ---------- CONTROLE ---------- */
R.controle = { t: 'Controle', e: [0x1F5A5, 0xFE0F], parent: 'inicio', render(v) { this.g = grid(v); this.upd(); }, upd() {
  const g = this.g; if (!g || !g.isConnected) return; g.innerHTML = '';
  const s = ST, tb = tri(s.touchpad), ts = tri(s.touchscreen);
  [
    { e: [0x2328, 0xFE0F], t: 'Teclado fisico', cls: s.teclado_bloqueado ? 'bad' : 'ok', s: s.teclado_bloqueado ? 'BLOQUEADO (toca pra liberar)' : 'liberado (toca pra bloquear)', go: () => post('acao', { nome: 'teclado' }) },
    { e: [0x1F5B1, 0xFE0F], t: 'Touchpad', cls: tb[0], s: tb[1], go: () => post('toggle', { tipo: 'touchpad' }) },
    { e: [0x1F446], t: 'Touchscreen', cls: ts[0], s: ts[1], go: () => post('toggle', { tipo: 'touchscreen' }) },
    { e: [0x267B, 0xFE0F], t: 'Reativar tudo', s: 'teclado, touchpad e touch', go: () => post('acao', { nome: 'reativar' }) },
    { e: [0x1F524], t: 'Teclado do Windows', s: 'abre o teclado na tela touch', go: () => post('acao', { nome: 'osk' }) },
    { e: [0x1F319], t: 'Apagar a tela', s: 'toca na tela pra acordar', go: () => post('acao', { nome: 'tela_off' }) },
    { e: [0x2615], t: 'Nunca dormir', cls: s.nunca_dormir ? 'ok' : 'neutral', s: s.nunca_dormir ? 'ATIVO (toca pra desativar)' : 'desativado (toca pra ativar)', go: () => post('acao', { nome: 'sono' }) }
  ].forEach(o => g.appendChild(tile({ ...o, go: async () => { await o.go(); setTimeout(refresh, 900); } })));
} };

/* ---------- MIDIA ---------- */
let BRI = 70, briT = null;

  'Log da limpeza': "Get-Content C:\\prisma\\limpeza.log -Tail 40",
  'Log do vigia': "if (Test-Path C:\\prisma\\painel\\vigia.log) { Get-Content C:\\prisma\\painel\\vigia.log -Tail 20 } else { 'sem log do vigia (tudo certo)' }",
  'Log do painel': "Get-Content C:\\prisma\\painel\\painel.log -Tail 30"
};
R['sistema/ps'] = { t: 'PowerShell', e: [0x1F9F0], parent: 'sistema', render(v) {
  const out = el('pre'); out.textContent = 'A saida aparece aqui.';
  async function rodar(script) {
    if (!script || !script.trim()) return; out.textContent = 'Rodando na tela touch...'; const t0 = Date.now();
    const tk = setInterval(() => { out.textContent = 'Rodando na tela touch... ' + Math.round((Date.now() - t0) / 1000) + ' s'; }, 1000);
    try { const r = await api('run', { script }); out.textContent = (r.saida || '(sem saida)') + '\n[codigo de saida: ' + r.codigo + ', ' + r.seg + ' s]'; } catch (e) { out.textContent = 'Erro: ' + (e.message || e); }
    clearInterval(tk); out.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  const g = grid(v);
  Object.keys(PRESETS).forEach(k => g.appendChild(tile({ e: [0x25B6, 0xFE0F], t: k, go: () => rodar(PRESETS[k]) })));
  g.appendChild(tile({ e: [0x270D, 0xFE0F], t: 'Script livre', s: 'escrever e executar', cls: 'acc', go: async () => { const s = await Teclado.abrir({ titulo: 'Script PowerShell', multilinha: true, rapidas: ['$', '|', '-', '{', '}', '\\', '"', "'"] }); if (s != null) await rodar(s); } }));
  v.appendChild(el('h2', '', 'Saida'));
  v.appendChild(out);
  const r = el('div', 'row'); r.appendChild(mini(E([0x1F4CB]) + ' Copiar saida', 'neutral', () => { const t = out.textContent; if (!t || t === 'A saida aparece aqui.') return toast('Nada pra copiar', true); copiar(t).then(() => toast('Saida copiada'), () => toast('Nao consegui copiar', true)); })); r.appendChild(mini('Limpar', 'neutral', () => { out.textContent = 'A saida aparece aqui.'; })); v.appendChild(r);
} };
R['sistema/devs'] = { t: 'Dispositivos', e: [0x1F50C], parent: 'sistema', render(v) {
  const g = grid(v); g.appendChild(el('div', 'vazio', 'Carregando lista...'));
  api('devs').then(l => {
    g.innerHTML = ''; if (!l.length) g.appendChild(el('div', 'vazio', 'Nenhum dispositivo encontrado.'));
    l.forEach(d => { const on = d.Status === 'OK'; g.appendChild(tile({ e: [on ? 0x2705 : 0x26D4], t: d.FriendlyName, s: d.Class + (on ? ' - ligado (toca pra desligar)' : ' - desligado (toca pra ligar)'), cls: on ? 'ok' : 'bad', go: async () => { const r = await api('dev', { id: d.InstanceId }); toast(r.msg || 'ok', r.ok === false); R['sistema/devs'].render((v.innerHTML = '', v)); } })); });
  }).catch(e => { g.innerHTML = ''; g.appendChild(el('div', 'vazio', 'Erro: ' + (e.message || e))); });
} };

/* ---------- vida: status, sistema, macros ---------- */
async function refresh() {
  try { ST = await api('status'); $('#conn').className = 'dot on'; if (cur && cur.upd) cur.upd(); } catch (e) { $('#conn').className = 'dot off'; }
}
async function sistema() {
  if (document.hidden || (cur !== R.inicio && cur !== R.status)) return;
  try { SIS = await api('sistema'); if (cur.upd) cur.upd(); } catch (e) {}
}
if (!TOKEN) pedirToken();
render(); refresh(); mLoad(); sistema();
setInterval(refresh, 8000); setInterval(sistema, 3000);
